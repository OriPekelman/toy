# toy — spin manifest (feat/spin-build guinea-pig; toy#107 / matz/spinel#1820).
#
# Native model: the ggml + tinynn archives are DECLARED BUILD STEPS
# ([[build]]), not carried-C and not preinstalled ffi_lib libraries.
# spin runs each entry in a scratch copy of its workdir (consented:
# --allow-native-build / SPIN_ALLOW_NATIVE_BUILD=1 / `spin trust toy`),
# verifies the declared artifacts, caches them content-keyed under
# $XDG_CACHE_HOME/spin/native/, and links them via [native] libs below.
#
# Layout notes (vs the Makefile world on main):
#   - tinynn lives at vendor/tinynn on this branch: spin's carried-C
#     discovery sweeps every .c outside build//vendor//test/ and would
#     try (and fail) to compile the shim per-file without ggml headers.
#   - vendor/tinynn/ggml-headers/ is a snapshot of vendor/ggml/include:
#     [[build]] entries are scratch-isolated, so the tinynn entry cannot
#     see the ggml entry's workdir; the public headers are duplicated to
#     keep the units (and their caches) independent.
#   - GPU variants (cuda/metal) are NOT expressed yet: consumer-side
#     feature enablement is unimplemented upstream (per #1820), and the
#     one-artifact-dir-per-package flattening would collide the CPU and
#     CUDA libggml.a basenames. Tracked for the follow-up issue.

[package]
name = "toy"
version = "0.9.0"

[features]
default = []

# --- ggml: vendored tree (pristine GGML_REV 41e7949), cmake, patched ---------
[[build]]
workdir   = "vendor/ggml"
patches   = ["vendor-patches/*.patch"]
command   = "cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_STATIC=ON -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF -DGGML_OPENCL=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DGGML_ACCELERATE=OFF -DGGML_BUILD_EXAMPLES=OFF -DGGML_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON && cmake --build build -j"
artifacts = ["build/src/libggml.a", "build/src/libggml-base.a", "build/src/libggml-cpu.a"]

# --- tinynn: the FFI shim archive, make -------------------------------------
[[build]]
workdir   = "vendor/tinynn"
command   = "make GGML_INC=-Iggml-headers libtinynn_ggml.a"
artifacts = ["libtinynn_ggml.a"]

# Link order: dependents before dependencies (tinynn → ggml → cpu → base);
# -lstdc++/-lpthread/-lm ride on ffi_lib in lib/toy/ffi/tinynn.rb.
[native]
libs = ["${build.out}/libtinynn_ggml.a", "${build.out}/libggml.a", "${build.out}/libggml-cpu.a", "${build.out}/libggml-base.a"]
